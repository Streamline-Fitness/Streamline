<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>Training Log Kanban Board</title>
    <link rel="stylesheet" href="/canvas.css">
    <script type="module" src="/client.js"></script>
  </head>
  <body>
    <main>
      <header class="page-header">
        <div>
          <p class="eyebrow">STREAMLINE FITNESS / PROTOTYPE</p>
          <h1>Training Log board</h1>
          <p class="intro">Move work between columns. Changes are shared with the agent and saved in this workspace.</p>
        </div>
      </header>

      <form id="new-card-form" class="new-card">
        <h2>Add a card</h2>
        <div class="new-card-fields">
          <label>
            Title
            <input id="new-title" name="title" maxlength="140" required placeholder="What needs doing?">
          </label>
          <label>
            Description <span class="optional">(optional)</span>
            <input id="new-description" name="description" maxlength="2000" placeholder="Add context">
          </label>
          <label>
            Column
            <select id="new-column" name="column">
              <option value="backlog">Backlog</option>
              <option value="ready">Ready</option>
              <option value="inProgress">In progress</option>
              <option value="done">Done</option>
            </select>
          </label>
          <button type="submit">Add card</button>
        </div>
      </form>

      <p id="message" class="message" role="status" aria-live="polite">Loading board…</p>
      <div class="board-toolbar">
        <p class="drag-hint">Scroll sideways to see every column. Drag a card, or choose a destination and select <strong>Move card</strong>.</p>
        <div class="scroll-controls" aria-label="Board scrolling">
          <button id="scroll-left" type="button" aria-label="Scroll board left">← Previous</button>
          <button id="scroll-right" type="button" aria-label="Scroll board right">Next →</button>
        </div>
      </div>
      <section id="board" class="board" aria-label="Training Log kanban board. Scroll horizontally to see all columns." tabindex="0"></section>
    </main>
  </body>
</html>
